steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-backend:$COMMIT_SHA'
      - '-t'
      - 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-backend:latest'
      - './backend'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-backend:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-backend:latest']

  # Deploy backend to Cloud Run.
  # Repeated --set-env-vars flags overwrite each other in gcloud, so every var
  # goes in one comma-separated flag. Cloud SQL flags are only added when
  # _CLOUDSQL_INSTANCE is set; blank it out to fall back to SQLite.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        ENV_VARS="DEBUG=False,ALLOWED_HOSTS=*,SEED_ON_START=${_SEED_ON_START}"
        EXTRA=""

        if [ -n "${_CLOUDSQL_INSTANCE}" ]; then
          ENV_VARS="$${ENV_VARS},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER}"
          ENV_VARS="$${ENV_VARS},INSTANCE_CONNECTION_NAME=${_CLOUDSQL_INSTANCE}"
          EXTRA="--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}"
          EXTRA="$${EXTRA} --set-secrets=SECRET_KEY=${_SECRET_KEY_NAME}:latest,DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest"
        fi

        gcloud run deploy espress \
          --image=australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-backend:$COMMIT_SHA \
          --region=australia-southeast1 \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --set-env-vars="$${ENV_VARS}" \
          $${EXTRA}

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-frontend:$COMMIT_SHA'
      - '-t'
      - 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-frontend:latest'
      - './frontend'

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-frontend:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-frontend:latest']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'espress-frontend'
      - '--image=australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-frontend:$COMMIT_SHA'
      - '--region=australia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'

images:
  - 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-backend:$COMMIT_SHA'
  - 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/espress/espress-frontend:$COMMIT_SHA'

# _CLOUDSQL_INSTANCE points at the Cloud SQL instance (PROJECT:REGION:INSTANCE).
# Clear it (here or in the trigger's substitutions) to fall back to SQLite.
substitutions:
  _CLOUDSQL_INSTANCE: 'vertex-ai-507310:australia-southeast1:espress-db'
  _DB_NAME: 'espress'
  _DB_USER: 'espress'
  _SECRET_KEY_NAME: 'django-secret-key'
  _DB_PASSWORD_SECRET: 'espress-db-password'
  _SEED_ON_START: 'true'

options:
  logging: CLOUD_LOGGING_ONLY
